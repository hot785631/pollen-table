<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-labelledby="title desc">
  <title id="title">微境：花粉擂台 · 蚂蚁和甲虫的花粉对局</title>
  <desc id="desc">第一轮，蚂蚁先手。五条花道上还没有昆虫，每条花道各有一颗花粉。双方各有零分，目标三十分。蚂蚁有三点太阳。统一牌堆发出六张手牌，依次是两费三力伙伴、一费减一撞击、一费一力伙伴、一费搭把手、三费五力伙伴、两费减二撞击。左边的循环箭头可换一张牌。</desc>
